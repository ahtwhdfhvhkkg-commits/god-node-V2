<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD NODE V2 - COMMAND CENTER</title>
    <style>
        /* Strict Hacker Neon-Green & Black Theme */
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-shadow: 0 0 15px #00ffcc;
            margin-bottom: 5px;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: #0a0a0f;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px dashed #004433;
        }
        h3 {
            margin-top: 0;
            color: #00ffa0;
        }
        input, select, button {
            background: #020202;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            border-radius: 4px;
        }
        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        button {
            cursor: pointer;
            font-weight: bold;
            background: #002211;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .input-group input {
            flex-grow: 1;
        }
        .terminal {
            background: #000;
            border: 1px solid #004433;
            padding: 20px;
            height: 350px;
            overflow-y: auto;
            font-size: 14px;
            color: #00ffaa;
            line-height: 1.5;
            box-shadow: inset 0 0 10px #000;
        }
        .vault-list {
            margin-top: 15px;
            font-size: 13px;
            color: #66aa88;
        }
        .vault-item {
            color: #00ffcc;
            font-weight: bold;
            background: #003322;
            padding: 3px 8px;
            border-radius: 3px;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <h1>GOD NODE V2</h1>
    <p style="margin-top: 0; letter-spacing: 2px;">● NEURAL LINK ACTIVE</p>

    <div class="container">
        <!-- API VAULT SECTION -->
        <div class="section">
            <h3>[ SECURE API VAULT ]</h3>
            <div class="input-group">
                <select id="apiProvider">
                    <option value="gemini">Google Gemini</option>
                    <option value="openai">OpenAI (GPT-4)</option>
                    <option value="openrouter">OpenRouter</option>
                    <option value="elevenlabs">ElevenLabs (Audio)</option>
                    <option value="claude">Anthropic Claude</option>
                    <option value="gdrive">Google Drive (Storage)</option>
                </select>
                <input type="password" id="apiKeyInput" placeholder="Enter API Key here to load into memory...">
                <button onclick="addApiKey()">ADD KEY</button>
            </div>
            <div id="vaultDisplay" class="vault-list">Keys Loaded: [ None ]</div>
        </div>

        <!-- COMMAND SECTION -->
        <div class="section">
            <h3>[ DIRECTIVE INPUT ]</h3>
            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <input type="password" id="masterPin" placeholder="Master PIN (7777)" value="7777" style="width: 200px;">
                <select id="targetSystem" style="flex-grow: 1;">
                    <option value="generate_game">Target: Game Generation Swarm</option>
                    <option value="universal_nexus">Target: Multi-Brain Routing Nexus</option>
                </select>
            </div>

            <div class="input-group">
                <input type="text" id="directiveInput" placeholder="> Type your God Command here...">
                <button onclick="executeCommand()" style="width: 150px; font-size: 16px;">EXECUTE</button>
            </div>
        </div>

        <!-- TERMINAL SECTION -->
        <div class="section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
            <h3>[ LIVE TERMINAL OUTPUT ]</h3>
            <div class="terminal" id="terminalOutput">
                > System initialized. Awaiting API keys and directives...
            </div>
        </div>
    </div>

    <script>
        // Global API Vault memory structure
        let apiVault = {
            "gemini": [], "openai": [], "openrouter": [], 
            "elevenlabs": [], "claude": [], "gdrive": []
        };

        const terminal = document.getElementById('terminalOutput');
        const vaultDisplay = document.getElementById('vaultDisplay');

        // Terminal Logging Function
        function logToTerminal(message, isError = false) {
            const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
            const color = isError ? '#ff3333' : '#00ffcc';
            terminal.innerHTML += `<br><span style="color: ${color}">[${timestamp}] ${message}</span>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Add API Key to Vault
        function addApiKey() {
            const provider = document.getElementById('apiProvider').value;
            const keyInput = document.getElementById('apiKeyInput');
            const key = keyInput.value.trim();

            if (key) {
                if (!apiVault[provider]) apiVault[provider] = [];
                
                if (!apiVault[provider].includes(key)) {
                    apiVault[provider].push(key);
                    keyInput.value = ''; // Clear input for safety
                    updateVaultDisplay();
                    logToTerminal(`> SUCCESS: 1x Key securely injected for [${provider.toUpperCase()}]`);
                } else {
                    logToTerminal(`> WARNING: Key already exists in memory for [${provider.toUpperCase()}]`, true);
                }
            } else {
                logToTerminal('> ERROR: Cannot inject an empty key.', true);
            }
        }

        // Update UI Vault Display
        function updateVaultDisplay() {
            let loaded = [];
            for (const [provider, keys] of Object.entries(apiVault)) {
                if (keys.length > 0) {
                    loaded.push(`<span class="vault-item">${provider.toUpperCase()} (${keys.length})</span>`);
                }
            }
            vaultDisplay.innerHTML = loaded.length > 0 ? `Keys Loaded: ${loaded.join(' ')}` : 'Keys Loaded: [ None ]';
        }

        // Execute Command Sequence
        async function executeCommand() {
            const pin = document.getElementById('masterPin').value;
            const target = document.getElementById('targetSystem').value;
            const directive = document.getElementById('directiveInput').value;

            if (!directive) {
                logToTerminal('> ERROR: Directive cannot be empty.', true);
                return;
            }

            logToTerminal(`> Initializing Neural Link to target [${target}]...`);
            logToTerminal(`> Executing Directive: "${directive}"`);

            const payload = {
                api_vault: apiVault,
                target_system: target,
                directive: directive,
                master_pin: pin
            };

            try {
                // Determine the correct backend URL (handles localhost vs Render domain)
                const backendUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                                   ? 'http://localhost:8000/execute' 
                                   : '/execute';

                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // THE JSON FIX: Safely parse text first to prevent crash on Render Timeout
                const textResult = await response.text(); 
                
                try {
                    const jsonResult = JSON.parse(textResult);
                    logToTerminal(`> [SERVER RESPONSE SUCCESS]:`);
                    // Beautify JSON output in the terminal
                    const formattedJson = JSON.stringify(jsonResult, null, 2)
                        .replace(/\n/g, '<br>')
                        .replace(/ /g, '&nbsp;');
                    logToTerminal(formattedJson);
                } catch (e) {
                    // This catches the exact HTML Timeout Error you were facing
                    logToTerminal(`> [SERVER TIMEOUT / CRASH]: The server took too long and Render cut the connection.`, true);
                    logToTerminal(`> [RAW OUTPUT]: ${textResult.substring(0, 100)}...`, true);
                }

            } catch (error) {
                logToTerminal(`> [NETWORK FATAL ERROR]: ${error.message}`, true);
            }
        }
    </script>
</body>
    </html>
