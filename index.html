<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>God Node V2 - Command Center</title>
    <style>
        :root {
            --neon-green: #00ffcc;
            --dark-bg: #0a0a0f;
            --terminal-bg: #050508;
            --danger-red: #ff003c;
        }
        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            text-align: center;
            text-shadow: 0 0 10px var(--neon-green);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .status-badge {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--neon-green);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 30px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        /* The Massive God Button */
        .wake-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4), inset 0 0 20px rgba(0, 255, 204, 0.2);
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .wake-btn:active {
            transform: scale(0.95);
            background: rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.8), inset 0 0 40px rgba(0, 255, 204, 0.5);
        }
        .wake-btn span {
            font-size: 0.8rem;
            margin-top: 10px;
            opacity: 0.7;
        }
        /* Live Terminal */
        .terminal {
            margin-top: 40px;
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: var(--terminal-bg);
            border: 1px solid #333;
            border-left: 3px solid var(--neon-green);
            padding: 10px;
            overflow-y: auto;
            font-size: 0.85rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .log-entry { margin-bottom: 5px; }
        .log-time { color: #888; margin-right: 10px; }
        .log-system { color: #fff; }
        
        /* Pulse Animation */
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 204, 0.8); }
            100% { box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); }
        }
        .listening {
            border-color: var(--danger-red) !important;
            color: var(--danger-red) !important;
            animation: pulse 1s infinite;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.4), inset 0 0 20px rgba(255, 0, 60, 0.2);
        }
    </style>
</head>
<body>

    <h1>GOD NODE V2</h1>
    <div class="status-badge" id="conn-status">🟢 NEURAL LINK ACTIVE</div>

    <button class="wake-btn" id="wakeBtn" onclick="toggleListening()">
        AWAKEN
        <span>Tap or say "Hai Gemini"</span>
    </button>

    <div class="terminal" id="terminalBox">
        <div class="log-entry"><span class="log-time">[SYSTEM]</span><span class="log-system"> Command Center Initialized...</span></div>
        <div class="log-entry"><span class="log-time">[NETWORK]</span><span class="log-system"> Connecting to Render Backend... OK</span></div>
    </div>

    <script>
        const terminal = document.getElementById('terminalBox');
        const wakeBtn = document.getElementById('wakeBtn');
        let isListening = false;

        function addLog(message, type="SYSTEM") {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
            const logHTML = `<div class="log-entry"><span class="log-time">[${time}]</span><span style="color: ${type === 'ERROR' ? '#ff003c' : '#00ffcc'}"> ${message}</span></div>`;
            terminal.innerHTML += logHTML;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function toggleListening() {
            isListening = !isListening;
            if(isListening) {
                wakeBtn.classList.add('listening');
                wakeBtn.innerHTML = 'LISTENING...<span>Awaiting Audio Input</span>';
                addLog("Mic activated. Waiting for wake word...", "SYSTEM");
                // Here we will link the Web Speech API / WebSocket audio stream
                setTimeout(() => {
                    addLog("Target acquired. Generating 3D parameters...", "SYSTEM");
                }, 2000);
            } else {
                wakeBtn.classList.remove('listening');
                wakeBtn.innerHTML = 'AWAKEN<span>Tap or say "Hai Gemini"</span>';
                addLog("Mic deactivated. Neural link on standby.", "SYSTEM");
            }
        }

        // Establish WebSocket Connection
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        
        try {
            addLog(`Attempting WS connection to backend...`, "SYSTEM");
            // const ws = new WebSocket(wsUrl); // Will uncomment when backend WS is ready
        } catch(e) {
            addLog("WS Connection deferred until backend route is live.", "ERROR");
        }
    </script>
</body>
</html>
