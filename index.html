<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>God Node V2.0 | Enterprise Autonomous Studio</title>
    
    <!-- External Dependencies (Tailwind, FontAwesome, Three.js WebGPU) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Strict Monochrome & Performance Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { black: '#000000', white: '#ffffff', gray: { 900: '#111', 800: '#222', 700: '#333', 400: '#888' } },
                    animation: {
                        'scanline': 'scanline 8s linear infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 4s linear infinite',
                    },
                    keyframes: {
                        scanline: { '0%': { transform: 'translateY(-100%)' }, '100%': { transform: 'translateY(100vh)' } }
                    }
                }
            }
        }
    </script>

    <!-- Complex UI Styles & Waveform Mathematics -->
    <style>
        :root { --ui-border: #333; --ui-bg: #000; --ui-text: #fff; --ui-accent: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--ui-bg); color: var(--ui-text); font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, monospace; overflow: hidden; height: 100dvh; width: 100vw; }
        
        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #fff; }

        /* CRT Terminal Effect Overlay */
        .crt-overlay { pointer-events: none; position: absolute; inset: 0; z-index: 50; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; opacity: 0.15; }
        .scanline { width: 100%; height: 10px; background: rgba(255,255,255,0.1); position: absolute; z-index: 51; opacity: 0.4; pointer-events: none; }

        /* Voice Waveform Canvas */
        #voice-visualizer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; }
        .mic-active #voice-visualizer { opacity: 1; }
        .mic-active .fa-microphone { display: none; }

        /* Split Pane Layout */
        .layout-grid { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 48px 1fr 80px; height: 100dvh; width: 100vw; }
        @media (max-width: 768px) { .layout-grid { grid-template-columns: 1fr; grid-template-rows: 48px 1fr 70px; } .sidebar { display: none; } }
        
        .header { grid-column: 1 / -1; border-bottom: 1px solid var(--ui-border); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; background: #0a0a0a; z-index: 20; }
        .sidebar { border-right: 1px solid var(--ui-border); background: #050505; display: flex; flex-direction: column; overflow: hidden; }
        .viewport { position: relative; background: #000; overflow: hidden; display: flex; flex-direction: column; }
        .command-bar { grid-column: 1 / -1; border-top: 1px solid var(--ui-border); background: #0a0a0a; display: flex; align-items: flex-end; padding: 12px 16px; z-index: 20; }

        /* Viewport Layers */
        #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
        #webrtc-video { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; object-fit: cover; display: none; }
        .hud-overlay { position: absolute; inset: 0; z-index: 10; pointer-events: none; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Terminal Log */
        .terminal-log { background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 8px; font-family: monospace; font-size: 10px; width: 300px; max-height: 150px; overflow-y: auto; pointer-events: auto; }
        .log-entry { margin-bottom: 4px; line-height: 1.2; word-wrap: break-word; }
        .log-info { color: #fff; } .log-warn { color: #aaa; } .log-error { color: #ff3333; } .log-sys { color: #888; }

        /* Loader */
        .god-loader { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .god-loader.active { opacity: 1; pointer-events: auto; }
        
        /* Complex Input Area */
        .input-wrapper { flex: 1; background: #111; border: 1px solid var(--ui-border); border-radius: 8px; display: flex; align-items: center; padding: 4px 12px; transition: border-color 0.2s; position: relative; }
        .input-wrapper:focus-within { border-color: #fff; }
        #god-prompt { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: monospace; font-size: 14px; padding: 8px 0; resize: none; max-height: 120px; overflow-y: auto; }
        .btn-action { background: #fff; color: #000; border: none; height: 36px; padding: 0 16px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-action:hover { background: #ccc; }
        .btn-icon { background: transparent; color: #888; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: all 0.2s; position: relative; }
        .btn-icon:hover { color: #fff; background: #222; }
    </style>
</head>
<body>

    <!-- Visual Effects -->
    <div class="crt-overlay"></div>
    <div class="scanline animate-scanline"></div>

    <div class="layout-grid">
        
        <!-- 1. HEADER (System Status) -->
        <header class="header">
            <div class="flex items-center gap-3">
                <i class="fa-brands fa-connectdevelop text-xl text-white animate-pulse-slow"></i>
                <h1 class="font-bold tracking-[0.2em] text-sm uppercase">God Node <span class="border border-gray-700 px-1 text-[10px] ml-1 rounded">V2.0</span></h1>
            </div>
            
            <div class="flex items-center gap-4 font-mono text-[10px] text-gray-400 uppercase tracking-widest">
                <div class="hidden md:flex items-center gap-2 border border-gray-800 px-2 py-1 rounded">
                    <i class="fa-brands fa-google-drive"></i> <span id="drive-status">Vault: Syncing...</span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="network-ping">Ping: --ms</span>
                </div>
                <div class="flex items-center gap-2">
                    <div id="sys-status-indicator" class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                    <span id="sys-status-text">Engine Online</span>
                </div>
            </div>
        </header>

        <!-- 2. SIDEBAR (Asset Store & Build Pipeline) -->
        <aside class="sidebar">
            <div class="p-3 border-b border-gray-800">
                <h3 class="text-[10px] text-gray-500 tracking-[0.1em] uppercase mb-2">Build Pipeline</h3>
                <div class="space-y-2">
                    <button onclick="GodUI.triggerBuild('web')" class="w-full text-left text-xs py-2 px-3 bg-gray-900 border border-gray-800 hover:border-white transition rounded flex justify-between items-center group">
                        <span>Web (.ZIP)</span> <i class="fa-solid fa-box-archive text-gray-600 group-hover:text-white"></i>
                    </button>
                    <button onclick="GodUI.triggerBuild('mobile')" class="w-full text-left text-xs py-2 px-3 bg-gray-900 border border-gray-800 hover:border-white transition rounded flex justify-between items-center group">
                        <span>Mobile (.APK)</span> <i class="fa-brands fa-android text-gray-600 group-hover:text-white"></i>
                    </button>
                    <button onclick="GodUI.triggerBuild('pc')" class="w-full text-left text-xs py-2 px-3 bg-gray-900 border border-gray-800 hover:border-white transition rounded flex justify-between items-center group">
                        <span>PC (.EXE)</span> <i class="fa-brands fa-windows text-gray-600 group-hover:text-white"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 p-3 overflow-y-auto">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-[10px] text-gray-500 tracking-[0.1em] uppercase">G-Drive Assets</h3>
                    <button onclick="GodUI.refreshAssets()" class="text-gray-500 hover:text-white"><i class="fa-solid fa-rotate-right text-[10px]"></i></button>
                </div>
                <div id="asset-list" class="space-y-1">
                    <!-- Assets injected via JS -->
                </div>
            </div>
        </aside>

        <!-- 3. VIEWPORT (3D Canvas, WebRTC, HUD) -->
        <main class="viewport">
            
            <!-- Loading Overlay -->
            <div id="god-loader" class="god-loader">
                <i class="fa-solid fa-atom text-4xl mb-4 animate-spin-slow text-white"></i>
                <div class="font-mono text-xs tracking-[0.2em] uppercase text-white mb-2">Orchestrating Reality</div>
                <div id="loader-text" class="font-mono text-[10px] text-gray-500">Connecting to Quantum Node...</div>
                
                <!-- Progress Bar -->
                <div class="w-64 h-1 bg-gray-900 mt-4 rounded overflow-hidden">
                    <div id="loader-progress" class="h-full bg-white w-0 transition-all duration-300"></div>
                </div>
            </div>

            <!-- Client-Side Render Target (Fallback/HTML5 Mode) -->
            <canvas id="game-canvas"></canvas>
            
            <!-- Cloud Gaming Render Target (WebRTC Mode) -->
            <video id="webrtc-video" autoplay playsinline></video>
            
            <!-- Heads Up Display (HUD) -->
            <div class="hud-overlay">
                <!-- Top Right: Performance Metrics -->
                <div class="flex justify-end w-full">
                    <div class="font-mono text-[10px] bg-black/80 border border-gray-800 p-2 rounded text-right pointer-events-auto">
                        <div id="hud-fps" class="text-white">FPS: 0</div>
                        <div id="hud-ram" class="text-gray-400">RAM: 0MB</div>
                        <div id="hud-mode" class="text-gray-500 mt-1">Mode: LOCAL_GPU</div>
                    </div>
                </div>
                
                <!-- Bottom Left: Live Terminal -->
                <div class="terminal-log" id="terminal-log">
                    <div class="log-entry log-sys">[SYSTEM] God Node V2 Client Initialized.</div>
                </div>
            </div>
        </main>

        <!-- 4. COMMAND BAR (Input, Voice, Execution) -->
        <footer class="command-bar gap-3">
            <div class="input-wrapper">
                
                <!-- Advanced Voice Input Button -->
                <button id="mic-btn" class="btn-icon mr-2 flex-shrink-0" onmousedown="GodVoice.startListening()" onmouseup="GodVoice.stopListening()" ontouchstart="GodVoice.startListening()" ontouchend="GodVoice.stopListening()">
                    <i class="fa-solid fa-microphone"></i>
                    <!-- HTML5 Canvas for real-time soundwave mathematics -->
                    <canvas id="voice-visualizer"></canvas>
                </button>
                
                <textarea id="god-prompt" rows="1" placeholder="Define reality... (e.g., 'Generate a AAA racing game' or 'Patch the car physics')" oninput="this.style.height='auto';this.style.height=(this.scrollHeight)+'px';"></textarea>
                
                <!-- Attachment/Context Button -->
                <button class="btn-icon ml-2 flex-shrink-0" title="Attach Context">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
            </div>
            
            <button class="btn-action flex-shrink-0" onclick="GodUI.executeDirective()">
                Execute <i class="fa-solid fa-bolt ml-2"></i>
            </button>
        </footer>
    </div>

    <!-- ===================================================================== -->
    <!-- ENTERPRISE JAVASCRIPT ARCHITECTURE (CLIENT-SIDE MONOLITH) -->
    <!-- ===================================================================== -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ---------------------------------------------------------
        // MODULE 1: TERMINAL & LOGGER SYSTEM
        // ---------------------------------------------------------
        class TerminalLogger {
            constructor(elementId) {
                this.terminal = document.getElementById(elementId);
                this.logHistory = [];
            }
            
            log(msg, type = 'sys') {
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type}`;
                const time = new Date().toISOString().split('T')[1].slice(0,8);
                entry.innerText = `[${time}] ${msg}`;
                
                this.terminal.appendChild(entry);
                this.terminal.scrollTop = this.terminal.scrollHeight;
                
                this.logHistory.push({time, msg, type});
                if(this.terminal.children.length > 50) this.terminal.firstChild.remove();
                
                // Also mirror to browser console for debug
                if(type === 'error') console.error(msg);
                else console.log(`[GodNode] ${msg}`);
            }
        }
        const Logger = new TerminalLogger('terminal-log');

        // ---------------------------------------------------------
        // MODULE 2: WEB SPEECH API & AUDIO MATHEMATICS
        // ---------------------------------------------------------
        class VoiceEngine {
            constructor() {
                this.btn = document.getElementById('mic-btn');
                this.promptInput = document.getElementById('god-prompt');
                this.canvas = document.getElementById('voice-visualizer');
                this.ctx = this.canvas.getContext('2d');
                this.isListening = false;
                
                this.audioCtx = null;
                this.analyser = null;
                this.dataArray = null;
                this.animationId = null;
                
                this.initSpeech();
            }

            initSpeech() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    Logger.log("Web Speech API not supported in this browser.", "error");
                    return;
                }
                
                this.recognition = new SpeechRecognition();
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                
                this.recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    this.promptInput.value = transcript;
                };
                
                this.recognition.onerror = (e) => Logger.log(`Voice Error: ${e.error}`, "warn");
                this.recognition.onend = () => this.stopListening();
            }

            async initAudioMath() {
                if (this.audioCtx) return;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = this.audioCtx.createMediaStreamSource(stream);
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 64; // Low res for aesthetic waveform
                    source.connect(this.analyser);
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    
                    // Resize canvas to match button size
                    this.canvas.width = this.btn.offsetWidth;
                    this.canvas.height = this.btn.offsetHeight;
                } catch(e) {
                    Logger.log("Microphone access denied for waveform.", "warn");
                }
            }

            drawWaveform() {
                if (!this.isListening || !this.analyser) return;
                
                this.animationId = requestAnimationFrame(() => this.drawWaveform());
                this.analyser.getByteFrequencyData(this.dataArray);
                
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.fillStyle = '#ffffff';
                
                const barWidth = (this.canvas.width / this.analyser.frequencyBinCount) * 1.5;
                let x = 0;
                
                for(let i = 0; i < this.analyser.frequencyBinCount; i++) {
                    const barHeight = (this.dataArray[i] / 255) * this.canvas.height * 0.8;
                    const y = (this.canvas.height - barHeight) / 2; // Center vertically
                    
                    // Draw rounded rects for wave
                    this.ctx.beginPath();
                    this.ctx.roundRect(x, y, barWidth - 1, barHeight, 2);
                    this.ctx.fill();
                    
                    x += barWidth;
                }
            }

            async startListening() {
                if (this.isListening) return;
                this.isListening = true;
                this.btn.classList.add('mic-active');
                
                if(this.recognition) this.recognition.start();
                
                await this.initAudioMath();
                if(this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();
                this.drawWaveform();
                
                Logger.log("Voice Engine Activated. Listening...", "sys");
            }

            stopListening() {
                if (!this.isListening) return;
                this.isListening = false;
                this.btn.classList.remove('mic-active');
                
                if(this.recognition) this.recognition.stop();
                if(this.animationId) cancelAnimationFrame(this.animationId);
                
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                Logger.log("Voice Engine Deactivated.", "sys");
            }
        }
        window.GodVoice = new VoiceEngine(); // Expose to global for inline handlers

        // --------
