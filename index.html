<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD NODE V2 | Command Center</title>
    <style>
        /* Sleek Premium Black & White Theme */
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #000000;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 0, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border: 2px solid #000000;
            padding: 40px;
            box-shadow: 8px 8px 0px #000000; /* Brutalist minimal shadow */
            margin-top: 30px;
        }
        .section {
            margin-bottom: 35px;
        }
        h3 {
            margin-top: 0;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        input, select, button {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 12px 15px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            outline: none;
            background: #f4f4f4;
        }
        button {
            cursor: pointer;
            background: #000000;
            color: #ffffff;
            text-transform: uppercase;
        }
        button:hover {
            background: #ffffff;
            color: #000000;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-group input {
            flex-grow: 1;
        }
        .terminal {
            background: #f9f9f9;
            border: 2px solid #000000;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .vault-item {
            display: inline-block;
            background: #000000;
            color: #ffffff;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>God Node V2</h1>
    <p style="margin-top: 0; font-weight: 600; font-size: 12px; letter-spacing: 1px;">
        <span class="status-dot"></span> ENTERPRISE NEURAL LINK ACTIVE
    </p>

    <div class="container">
        <!-- API VAULT -->
        <div class="section">
            <h3>Secure API Vault</h3>
            <div class="input-group">
                <select id="apiProvider">
                    <option value="gemini">Google Gemini</option>
                    <option value="openai">OpenAI (GPT-4)</option>
                    <option value="openrouter">OpenRouter</option>
                    <option value="gdrive">Google Drive</option>
                </select>
                <input type="password" id="apiKeyInput" placeholder="Enter API Key to load into memory...">
                <button onclick="addApiKey()">Add Key</button>
            </div>
            <div id="vaultDisplay" style="font-size: 13px; font-weight: 600;">Status: No keys loaded.</div>
        </div>

        <!-- COMMAND EXECUTION -->
        <div class="section">
            <h3>Directive Input</h3>
            <div class="input-group">
                <input type="password" id="masterPin" placeholder="PIN (7777)" value="7777" style="max-width: 100px;">
                <select id="targetSystem" style="flex-grow: 1;">
                    <option value="generate_game">Target: Game Generation Swarm</option>
                    <option value="universal_nexus">Target: Multi-Brain Routing</option>
                </select>
            </div>
            <div class="input-group">
                <input type="text" id="directiveInput" placeholder="Type your God Command here...">
                <button onclick="executeCommand()">Execute</button>
            </div>
        </div>

        <!-- BACKGROUND TASK CHECKER -->
        <div class="section">
            <h3>Task Status Monitor</h3>
            <div class="input-group">
                <input type="text" id="taskIdInput" placeholder="Enter Task ID to check progress...">
                <button onclick="checkTaskStatus()" style="background: #ffffff; color: #000000;">Check Status</button>
            </div>
        </div>

        <!-- TERMINAL -->
        <div class="section" style="margin-bottom: 0;">
            <h3>System Output</h3>
            <div class="terminal" id="terminalOutput">
                <b>SYSTEM BOOT COMPLETE.</b><br>Awaiting commands...<br>
            </div>
        </div>
    </div>

    <script>
        let apiVault = { "gemini": [], "openai": [], "openrouter": [], "gdrive": [] };
        const terminal = document.getElementById('terminalOutput');

        function logToTerminal(msg, isBold = false) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const content = isBold ? `<b>${msg}</b>` : msg;
            terminal.innerHTML += `<br>[${time}] ${content}`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function addApiKey() {
            const provider = document.getElementById('apiProvider').value;
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                if (!apiVault[provider].includes(key)) {
                    apiVault[provider].push(key);
                    document.getElementById('apiKeyInput').value = '';
                    updateVaultDisplay();
                    logToTerminal(`Key injected successfully for: ${provider.toUpperCase()}`, true);
                }
            }
        }

        function updateVaultDisplay() {
            let html = '';
            for (const [provider, keys] of Object.entries(apiVault)) {
                if (keys.length > 0) html += `<div class="vault-item">${provider.toUpperCase()} (${keys.length})</div>`;
            }
            document.getElementById('vaultDisplay').innerHTML = html || 'Status: No keys loaded.';
        }

        async function executeCommand() {
            const pin = document.getElementById('masterPin').value;
            const target = document.getElementById('targetSystem').value;
            const directive = document.getElementById('directiveInput').value;

            if (!directive || !pin) {
                logToTerminal('ERROR: PIN and Directive are required.');
                return;
            }

            logToTerminal(`Executing Directive: "${directive}"...`, true);

            try {
                const url = window.location.hostname === 'localhost' ? 'http://localhost:8000/execute' : '/execute';
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_vault: apiVault, target_system: target, directive: directive, master_pin: pin })
                });

                const data = await response.json();
                
                if(data.task_id) {
                    logToTerminal(`BACKGROUND TASK STARTED!`);
                    logToTerminal(`<b>TASK ID: ${data.task_id}</b>`);
                    logToTerminal(`Copy this ID and paste it in the 'Task Status Monitor' below to check progress.`);
                    document.getElementById('taskIdInput').value = data.task_id; // Auto-fill
                } else {
                    logToTerminal(JSON.stringify(data, null, 2).replace(/\n/g, '<br>'));
                }
            } catch (error) {
                logToTerminal(`NETWORK ERROR: ${error.message}`);
            }
        }

        async function checkTaskStatus() {
            const pin = document.getElementById('masterPin').value;
            const taskId = document.getElementById('taskIdInput').value.trim();

            if (!taskId || !pin) {
                logToTerminal('ERROR: PIN and Task ID are required to check status.');
                return;
            }

            logToTerminal(`Checking status for Task: ${taskId}...`);

            try {
                const url = window.location.hostname === 'localhost' ? 'http://localhost:8000/check_status' : '/check_status';
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_id: taskId, master_pin: pin })
                });

                const data = await response.json();
                const formatted = JSON.stringify(data, null, 2).replace(/\n/g, '<br>').replace(/ /g, '&nbsp;');
                logToTerminal(`<div style="background:#eaeaea; padding:10px; margin-top:5px;">${formatted}</div>`);
            } catch (error) {
                logToTerminal(`NETWORK ERROR: ${error.message}`);
            }
        }
    </script>
</body>
    </html>
